[package]
name = "rust-zerotier"
version = "0.1.0"
edition = "2021"
description = "An educational L2 VPN — virtual switch + virtual port with a minimalist GUI. Inspired by for-tristan/build-your-own-zerotier."
license = "MIT"
repository = "https://github.com/for-tristan/rust-zerotier"
keywords = ["vpn", "zerotier", "tap", "l2", "networking"]
categories = ["network-programming"]

[[bin]]
name = "rzt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# eframe pulls in egui + winit. Wayland is disabled (no wayland dev headers in
# this environment); the X11 backend is kept. On a normal desktop, default
# features work fine — this just trims the build for headless CI.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
